<div class="auth-container">
  <div class="auth-card">
    <h1>👋 Bem-vindo</h1>
    <p>Entra na tua conta SmartRecipes</p>

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        placeholder="o-teu-email@exemplo.com"
        [(ngModel)]="email"
      />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        placeholder="A tua password"
        [(ngModel)]="password"
      />
    </div>

    <button class="btn-primary" (click)="login()">Entrar</button>

    <p class="auth-link">
      Não tens conta?
      <a routerLink="/register">Cria uma aqui</a>
    </p>
  </div>
</div>
